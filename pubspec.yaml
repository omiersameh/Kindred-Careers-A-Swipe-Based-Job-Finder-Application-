name: kindred_careers
description: "Kindred Careers - AI-powered swipe-based job matching app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Swipe card UI
  flutter_card_swiper: ^7.0.0

  # Google Fonts for premium typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.6

  # Shared preferences (local storage)
  shared_preferences: ^2.2.3

  # HTTP client
  http: ^1.2.1

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  firebase_analytics: ^11.3.3
  google_sign_in: ^6.2.1

  # UUID generation
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
